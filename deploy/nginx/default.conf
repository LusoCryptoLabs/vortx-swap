# Vortx Swap: nginx for the static SPA, plus a same-origin caching reverse proxy for CKB read
# traffic. In production the frontend talks to /rpc and /indexer on its own origin (see
# apps/frontend/src/lib/cellswap.ts); this config caches those reads so concurrent browsers do not
# each reach the public node.
#
# This file is included inside the main nginx.conf `http {}` block, so http-context directives
# (proxy_cache_path, map) live here at the top, before the server block.

# Cache store for CKB read responses. Small keys zone (10m) + 256m body cap is plenty for short-TTL reads.
proxy_cache_path /var/cache/nginx/ckb levels=1:2 keys_zone=ckb_cache:10m max_size=256m inactive=30s use_temp_path=off;

# Mutating JSON-RPC must never be cached or coalesced; flag it by request body so /rpc can bypass.
map $request_body $ckb_nocache {
    default                0;
    "~*send_transaction"   1;
    "~*send_alert"         1;
    "~*remove_transaction" 1;
}

server {
    listen      80;
    server_tokens off;
    root        /usr/share/nginx/html;
    index       index.html;

    # ── Security headers. `always` so they are sent on errors too. No Content-Security-Policy is
    #    set: the app loads JoyID (WebAuthn popups), ccc wallet connectors and Google Fonts, so a CSP
    #    has to be tuned and tested against those origins or it breaks wallet connect. HSTS has no
    #    effect over plain HTTP and applies once the app is served over HTTPS. Permissions-Policy here
    #    does not restrict publickey-credentials-*, so passkeys/WebAuthn keep working.
    add_header X-Content-Type-Options   "nosniff"                                  always;
    add_header X-Frame-Options          "SAMEORIGIN"                               always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"          always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"     always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Keep JSON-RPC bodies in memory so $request_body is populated for the cache key (if a body spills
    # to a temp file, $request_body is empty and keys would collide). Read bodies are small; sends are
    # bypassed anyway.
    client_body_buffer_size 1m;
    client_max_body_size    4m;

    # ── Cached CKB endpoints (same-origin, so no CORS / no mixed content) ──
    location = /rpc     { include /etc/nginx/ckb-proxy.conf; proxy_pass https://testnet.ckb.dev/rpc; }
    location = /indexer { include /etc/nginx/ckb-proxy.conf; proxy_pass https://testnet.ckb.dev/indexer; }

    # ── Aggregator (OTX/orders/pools), same-origin proxy to the sibling container on the
    # shared docker network. Same-origin means the browser never needs CORS and the frontend's
    # VITE_AGGREGATOR_URL can be a plain relative path (/agg) that does not depend on the public
    # hostname. Not cached: every route here is a mutation or a short-lived read.
    #
    # The upstream hostname is put in a variable so nginx resolves it at request time via Docker's
    # embedded DNS (127.0.0.11), not once at worker startup: a plain `proxy_pass http://name:port/`
    # fails nginx startup entirely if that name isn't resolvable yet (frontend started before the
    # aggregator) and never re-resolves if the aggregator container restarts with a new IP.
    resolver 127.0.0.11 valid=10s;
    location /agg/ {
        # proxy_pass with a variable upstream (required above for runtime DNS) does not do nginx's
        # usual location-prefix stripping, since it can't tell at config-parse time which part of a
        # variable URL is the "replaced" prefix, so /agg/pools would otherwise forward as literally
        # /agg/pools upstream (404, no such route). Strip the prefix explicitly before proxying.
        # `set` must come before `rewrite ... break`: break halts the rewrite-phase directives that
        # follow it in this location, so a `set` placed after it would never run (uninitialized var).
        set $agg_upstream cellswap-aggregator:3002;
        rewrite ^/agg(/.*)$ $1 break;
        proxy_pass http://$agg_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Static SPA ──
    # /assets/ sets its own add_header, which makes nginx drop the server-level security headers here,
    # so re-declare them alongside the immutable cache policy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    # Self-destruct service worker: evicts a stale PWA worker registered at this origin's /sw.js. It
    # must be served as real JS with no-cache so the browser revalidates and can replace the old
    # worker. The SPA fallback below would serve index.html (text/html) here, which a service worker
    # update rejects without an error. The exact-match location keeps it out of that fallback.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/javascript;
    }

    location /        { try_files $uri $uri/ /index.html; }
}
