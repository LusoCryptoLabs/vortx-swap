# Shared proxy snippet for the cached CKB read endpoints (/rpc, /indexer).
# Included by deploy/nginx/default.conf. Identical polls from many browsers share one upstream call
# to the public node instead of each reaching it directly.
#
# Caching is keyed on the JSON-RPC request body, so distinct calls do not collide. Mutating calls
# (send_transaction, …) set $ckb_nocache=1 (see the map in default.conf) and bypass the cache: they
# must always reach the node and never be served stale or coalesced.
proxy_http_version    1.1;
proxy_set_header      Host testnet.ckb.dev;          # for mainnet, change to mainnet.ckb.dev (here and in default.conf)
proxy_ssl_server_name on;                            # send SNI so the upstream TLS handshake matches

proxy_cache           ckb_cache;
proxy_cache_methods   POST;                          # CKB RPC is JSON-RPC over POST
proxy_cache_key       "$uri|$request_body";          # body distinguishes get_cells vs get_transaction vs …
proxy_cache_valid     200 3s;                         # 3s freshness, well under the app's 10-15s polling interval
proxy_cache_lock      on;                             # single-flight: concurrent identical polls → one upstream call
proxy_cache_lock_timeout 5s;
proxy_cache_use_stale updating error timeout http_502 http_503 http_504;  # smooth over upstream blips
proxy_ignore_headers  Cache-Control Expires Set-Cookie;                    # the node sends no cache hints; we decide TTL
proxy_no_cache        $ckb_nocache;
proxy_cache_bypass    $ckb_nocache;

proxy_connect_timeout 10s;
proxy_read_timeout    60s;
add_header            X-Cache-Status $upstream_cache_status always;        # HIT/MISS/EXPIRED, for checking cache behavior
